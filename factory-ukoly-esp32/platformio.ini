; Tovarni (provisioning) firmware - samostatny PlatformIO projekt.
; Nahravat POUZE pres USB na nove/vracene kusy, MISTO ostreho firmware
; z ../src. Viz README.md v tomto projektu a ../README.md, sekce
; "OTA aktualizace".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7
    tzapu/WiFiManager@^2.0.17
